<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏦 Central de Bancos - Todos os Bancos do Brasil</title>
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0a0a0a;color:#fff;min-height:100vh}
.top{background:#fff;color:#000;padding:14px;display:flex;justify-content:space-between;align-items:center;font-weight:900;position:sticky;top:0;z-index:20}
.btnV{width:42px;height:42px;border-radius:50%;border:none;background:#000;color:#fff;font-size:18px;font-weight:bold}
.searchBar{background:#1a1a1a;margin:10px;border-radius:30px;padding:10px 16px;display:flex;align-items:center;gap:8px;border:1px solid #333}
.searchBar input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:15px}
.card{background:#151515;margin:10px;border-radius:18px;padding:12px;border:1px solid #222}
.item{background:#222;border-radius:16px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;border:1px solid #2a2a2a;transition:.2s}
.item:active{transform:scale(.97)}
.left{display:flex;gap:12px;align-items:center;flex:1;text-align:left}
.logo{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex-shrink:0;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.info b{font-size:15px;display:block}.info small{color:#888;font-size:11px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acts button{width:40px;height:40px;border-radius:50%;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn{padding:14px;border:none;border-radius:30px;font-weight:bold;cursor:pointer}
.amarelo{background:#FFD700;color:#000;width:100%}.verde{background:#01875f;color:#fff}.cinza{background:#2a2a2a;color:#fff}.laranja{background:#FF6B00;color:#fff}
.badge{background:#01875f;color:#fff;font-size:9px;padding:3px 7px;border-radius:10px;margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="top"><button class="btnV" onclick="history.back()">←</button>🏦 CENTRAL DE BANCOS<button class="btnV" onclick="location.reload()">↻</button></div>

<div class="searchBar">🔍 <input id="busca" placeholder="Buscar banco: Itaú, Nubank, Caixa..." oninput="filtrar()"></div>

<div class="card" style="background:linear-gradient(90deg,#FFD700,#FFA000);color:#000;text-align:center;font-weight:900;font-size:14px">
🏦 <span id="count">0</span> BANCOS REAIS • Toque em 📲 para Instalar pelo Play Store
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b style="color:#FFD700">📲 BANCOS INSTALADOS</b><small style="color:#666">Play Store vinculado</small></div>
<div id="lista"></div>
<button class="btn amarelo" onclick="addBanco()">➕ ADICIONAR BANCO + LINK PLAY STORE</button>
</div>

<div class="card">
<b style="color:#FFD700">⚙️ TODAS ATRIBUIÇÕES VINCULADAS</b>
<div class="grid2" style="margin-top:10px">
<button class="btn verde" onclick="window.open('https://wa.me/?text='+encodeURIComponent('Baixe minha CENTRAL DE BANCOS 🏦 '+location.href),'_blank')">💬 CONVIDAR MEMBROS</button>
<button class="btn cinza" onclick="if(navigator.share)navigator.share({title:'Central de Bancos',url:location.href});else{navigator.clipboard.writeText(location.href);alert('Link copiado!')}">📤 COMPARTILHAR</button>
<button class="btn cinza" onclick="backup()">💾 BACKUP</button>
<button class="btn cinza" onclick="document.getElementById('imp').click()">📥 RESTAURAR</button><input type="file" id="imp" accept=".json" style="display:none">
<button class="btn cinza" style="background:#3a0000;color:#ff6666;border:1px solid #ff1744" onclick="if(confirm('Lixeira geral? Apagar tudo?')){localStorage.removeItem('centralBancosV16');location.reload()}">🗑️ LIXEIRA GERAL</button>
<button class="btn laranja" onclick="window.open('https://play.google.com/store/search?q=bancos%20brasil&c=apps','_blank')">🏪 PLAY STORE</button>
</div>
</div>

<script>
let bancosBase=[
{nome:'Itaú Unibanco',icone:'itau',cor:'#FF6B00',play:'https://play.google.com/store/apps/details?id=com.itau',desc:'Itaú - maior banco privado'},
{nome:'Bradesco',icone:'bradesco',cor:'#CC0000',play:'https://play.google.com/store/apps/details?id=com.bradesco',desc:'Banco Bradesco'},
{nome:'Santander',icone:'santander',cor:'#EC0000',play:'https://play.google.com/store/apps/details?id=com.santander.app',desc:'Santander Brasil'},
{nome:'Nubank',icone:'Nu',cor:'#8A05BE',play:'https://play.google.com/store/apps/details?id=com.nu.production',desc:'Nubank - roxinho'},
{nome:'Banco do Brasil',icone:'BB',cor:'#FFF000',corTexto:'#000',play:'https://play.google.com/store/apps/details?id=br.com.bb.android',desc:'Banco do Brasil'},
{nome:'Caixa Econômica',icone:'CAIXA',cor:'#0066B3',play:'https://play.google.com/store/apps/details?id=br.gov.caixa',desc:'Caixa Federal'},
{nome:'Caixa Tem',icone:'CAIXA Tem',cor:'#0B6E4F',play:'https://play.google.com/store/apps/details?id=br.gov.caixa.bancocontas',desc:'CAIXA Tem - Auxílio'},
{nome:'Inter',icone:'Inter',cor:'#FF7A00',play:'https://play.google.com/store/apps/details?id=br.com.intermedium',desc:'Banco Inter - Laranja'},
{nome:'C6 Bank',icone:'C6',cor:'#000',borda:'#FFE600',play:'https://play.google.com/store/apps/details?id=com.c6bank.app',desc:'C6 Bank'},
{nome:'PicPay',icone:'PicPay',cor:'#11C76F',play:'https://play.google.com/store/apps/details?id=com.picpay',desc:'PicPay - Carteira'},
{nome:'Mercado Pago',icone:'Mercado Pago',cor:'#009EE3',play:'https://play.google.com/store/apps/details?id=com.mercadopago.wallet',desc:'Mercado Pago'},
{nome:'Next',icone:'next',cor:'#00C853',play:'https://play.google.com/store/apps/details?id=br.com.bradesco.next',desc:'Next - Banco Digital'}
];

let bancos=JSON.parse(localStorage.getItem('centralBancosV16')||'null')||bancosBase;
function save(){localStorage.setItem('centralBancosV16',JSON.stringify(bancos));render();}

function render(lista=bancos){
let d=document.getElementById('lista'); document.getElementById('count').innerText=lista.length;
d.innerHTML=lista.map((b,idx)=>{
let realIdx=bancos.indexOf(b);
return `<div class="item" style="border-left:5px solid ${b.cor}">
<div class="left">
<div class="logo" style="background:${b.cor};color:${b.corTexto||'#fff'};${b.borda?'border:2px solid '+b.borda:''}">${b.icone.substring(0,4).toUpperCase()}</div>
<div class="info"><b>${b.nome} <span class="badge">PLAY STORE</span></b><small>${b.desc}</small></div>
</div>
<div class="acts">
<button style="background:#fff;color:#000" onclick="window.open('${b.play}','_blank')" title="Abrir">▶️</button>
<button style="background:#01875f;color:#fff" onclick="window.open('${b.play}','_blank')" title="Instalar Play Store">📲</button>
<button style="background:#2962FF;color:#fff" onclick="window.open('https://wa.me/?text='+encodeURIComponent('Instala o ${b.nome} 🏦 ${b.play}'),' _blank')" title="Compartilhar">📤</button>
<button style="background:#333;color:#fff" onclick="editar(${realIdx})" title="Editar">✏️</button>
<button style="background:#FF1744;color:#fff" onclick="if(confirm('Apagar ${b.nome}? Lixeirinha')){bancos.splice(${realIdx},1);save()}" title="Lixeira individual">🗑️</button>
</div>
</div>`}).join('');
}

function filtrar(){let q=document.getElementById('busca').value.toLowerCase(); if(!q){render();return;} let f=bancos.filter(b=>b.nome.toLowerCase().includes(q)||b.desc.toLowerCase().includes(q)); render(f);}
function editar(i){let b=bancos[i]; let n=prompt('Nome:',b.nome); if(n)b.nome=n; let l=prompt('Link Play Store:',b.play); if(l!==null)b.play=l; save();}
function addBanco(){
let n=prompt('Nome do banco (ex: Banco Original):'); if(!n)return;
let sigla=prompt('Sigla para o logo (ex: BB, Nu, itau):',n.slice(0,4))||'🏦';
let lk=prompt('Link Play Store (cole completo):\nEx: https://play.google.com/store/apps/details?id=com.nu.production','https://play.google.com/store/apps/details?id=');
let cor=prompt('Cor do logo (ex: #FF6B00):','#'+Math.floor(Math.random()*16777215).toString(16))||'#FF6B00';
bancos.push({nome:n,icone:sigla,cor,play:lk||'https://play.google.com/store/search?q='+encodeURIComponent(n),desc:n});
save();
}
function backup(){let s="data:text/json;charset=utf-8,[STRIPPED] a=document.createElement('a');a.href=s;a.download='central-bancos-v16-'+Date.now()+'.json';a.click();}
document.getElementById('imp').addEventListener('change',e=>{let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>{try{bancos=JSON.parse(r.result);save();}catch{alert('Backup inválido')}}; r.readAsText(f);});
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}
</script>
</body>
</html>
